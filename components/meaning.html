<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESP AI CHATBOT - TRA NGHĨA</title><script src="../js/config.js"></script><script src="../js/bridge.js"></script><style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#f8fafc;color:#0f172a;font:15px Arial,sans-serif}.panel{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:24px;max-width:950px;margin:auto}h2{margin:0 0 8px;color:#0f2942}p{color:#64748b;line-height:1.6}.search{display:flex;gap:10px;margin:22px 0}input{flex:1;min-width:0;padding:13px;border:1px solid #cbd5e1;border-radius:12px;font:inherit}button{border:0;border-radius:12px;padding:12px 18px;background:#0f2942;color:#fff;font:inherit;cursor:pointer}button:disabled{opacity:.5}#searchStatus{color:#0f766e}#result{display:none;background:#f8fafc;border:1px solid #e2e8f0;border-radius:16px;padding:18px;margin-top:20px}.term{font-size:30px;color:#0f2942;font-weight:700;margin-bottom:8px}.meaning{font-size:18px;font-weight:600;color:#0f766e}#example{border-left:3px solid #0d9488;padding:12px;margin-top:16px;white-space:pre-line}#vocabImage{max-width:320px;max-height:230px;object-fit:contain;display:none;margin:16px 0}@media(max-width:550px){.search{flex-direction:column}body{padding:12px}}
</style></head><body><main class="panel"><h2>Tra nghĩa từ</h2><p>Tra cứu từ vựng tiếng Anh chuyên ngành, nghĩa và cách sử dụng bằng Dify AI.</p><form class="search" id="searchForm"><input id="searchInput" placeholder="Nhập từ vựng, ví dụ: vehicle" required><button id="searchBtn">Tra cứu AI</button></form><p id="searchStatus" aria-live="polite"></p><section id="result"><div class="term" id="word"></div><div id="ipa"></div><p class="meaning" id="meaning"></p><p id="meaningEn"></p><div id="example"></div><img id="vocabImage" alt="Hình minh họa từ vựng"></section></main><script>
let meaningSessionToken=sessionStorage.getItem('dify_meaning_token')||'';
const $=id=>document.getElementById(id);
$('searchForm').addEventListener('submit',e=>{e.preventDefault();let word=$('searchInput').value.trim();if(!word)return;let btn=$('searchBtn');btn.disabled=true;$('searchStatus').textContent='Đang tra cứu...';google.script.run.withSuccessHandler(res=>{btn.disabled=false;$('searchStatus').textContent='';if(res.sessionToken){meaningSessionToken=res.sessionToken;sessionStorage.setItem('dify_meaning_token',meaningSessionToken)}let v=res.vocabulary||{};if(!v.word&&res.answer){try{v=JSON.parse(res.answer).vocabulary||JSON.parse(res.answer)}catch{v={word:word,meaning_vi:res.answer}}}const val=(...names)=>names.map(k=>v[k]).find(x=>typeof x==='string'&&x.trim())||'';$('word').textContent=val('word')||word;$('ipa').textContent=val('bre_ipa','ipa','pronunciation');$('meaning').textContent=val('meaning_vi','meaning');$('meaningEn').textContent=val('meaning_en','body_text');let ex=v.examples;$('example').textContent=Array.isArray(ex)?ex.map(x=>typeof x==='string'?x:JSON.stringify(x)).join('\n'):val('example_en','example');$('result').style.display='block';const img=$('vocabImage');img.style.display=res.imageDataUrl?'block':'none';if(res.imageDataUrl)img.src=res.imageDataUrl;}).withFailureHandler(err=>{btn.disabled=false;$('searchStatus').textContent='Lỗi: '+err.message}).lookupMeaningOrFlashcard({mode:'meaning',word,sessionToken:meaningSessionToken})});
</script></body></html>
