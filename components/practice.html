</style><section class="stage tiles navy-refined navy-jewel"  aria-label="Xanh đậm · Viền ngọc"><div class="app"><header class="top"><div class="eyebrow"><span class="robot sprite sprite-11" aria-hidden="true"></span><span>ESP AI CHATBOT - VOCABULARY PRACTICE</span></div><h2>Hôm nay bạn muốn luyện gì?</h2><p>Chọn một hoặc nhiều dạng bài để bắt đầu.</p></header><div class="content"><fieldset class="practice-block vocabulary-block"><legend>LUYỆN TỪ VỰNG</legend><div class="choices" data-items="0,1,2,3,4,5"></div></fieldset><fieldset class="practice-block skills-block"><legend>VẬN DỤNG QUA 4 KỸ NĂNG</legend><div class="skill-grid" data-items="6,7,8,9"></div><div data-auto></div></fieldset></div><div class="selected-summary"><span class="count" aria-live="polite"></span><div class="selected-chips" aria-label="Các dạng bài đã chọn"></div></div><div class="foot"><button type="button" class="go cursor-interaction">Bắt đầu luyện tập →</button></div><div class="result" aria-live="polite"></div></div></section><script>
(() => {
  'use strict';
  const root = document.getElementById('practice-designs');
  const labels = ['Trắc nghiệm','Ghép từ – định nghĩa','Điền từ','Kết hợp từ','Chọn từ theo ngữ cảnh','Bài tổng hợp','Luyện nghe','Luyện nói','Luyện đọc','Luyện viết','Để chatbot tự chọn'];
  const el = (tag, text, cls) => { const n=document.createElement(tag); if(text !== undefined)n.textContent=text; if(cls)n.className=cls; return n; };
  root.querySelectorAll('.stage').forEach(stage => {
    const selected = new Set([0,2]);
    let busy=false, completed=false, sessionToken='', current=null, answerControls=[];
    const sentAnswers=new Map();
    const status=stage.querySelector('.result'), go=stage.querySelector('.go');
    const context=el('div',undefined,'practice-context');
    const wordLabel=el('label','Từ hoặc danh sách từ cần luyện');
    const words=el('input');words.type='text';words.placeholder='Ví dụ: vehicle hoặc vehicle, traffic, van';words.maxLength=3000;wordLabel.append(words);
    const topicLabel=el('label','Chủ đề (có thể để trống nếu đã nhập từ)');
    const topic=el('input');topic.type='text';topic.placeholder='Ví dụ: Traffic and vehicles';topic.maxLength=500;topicLabel.append(topic);
    context.append(wordLabel,topicLabel);stage.querySelector('.content').prepend(context);
    const output=el('section',undefined,'practice-output');output.hidden=true;output.setAttribute('aria-label','Bài luyện tập');stage.querySelector('.app').append(output);
    status.setAttribute('role','status');
    // Parent chat may call this API with the vocabulary context; no API key in HTML.
    function setContext(value){value=value||{};words.value=Array.isArray(value.words)?value.words.join(', '):String(value.words||'');topic.value=String(value.topic||'');}
    window.setPracticeContext=setContext;
    if(window.PRACTICE_CONTEXT)setContext(window.PRACTICE_CONTEXT);
    function update(){
      stage.querySelectorAll('[data-item]').forEach(b=>{const i=Number(b.dataset.item),yes=selected.has(i);b.disabled=busy;b.setAttribute('aria-pressed',String(yes));b.querySelector('.tick').textContent=yes?'✓':'';});
      const count=stage.querySelector('.count');count.replaceChildren(document.createTextNode('Đã chọn '),el('strong',String(selected.size)),document.createTextNode(' dạng bài'));
      const chips=stage.querySelector('.selected-chips');chips.replaceChildren();selected.forEach(i=>{const b=el('button',undefined,'selection-chip cursor-interaction');b.type='button';b.disabled=busy;b.setAttribute('aria-label','Bỏ chọn '+labels[i]);const icon=el('span',i===3?'🔗':undefined,'chip-icon sprite sprite-'+i);icon.setAttribute('aria-hidden','true');b.append(icon,el('span',labels[i]),el('span','×','chip-close'));b.onclick=()=>{selected.delete(i);update();};chips.append(b);});
      go.disabled=busy;words.disabled=busy;topic.disabled=busy;go.textContent=busy?'Đang tạo bài…':'Bắt đầu luyện tập →';
    }
    function make(i){const b=el('button',undefined,'choice cursor-interaction'+(i===10?' auto':''));b.type='button';b.dataset.item=i;const icon=el('span',i===3?'🔗':undefined,'ico sprite sprite-'+i);icon.setAttribute('aria-hidden','true');b.append(icon,el('span',labels[i],'label'),el('span','','tick'));b.onclick=()=>{if(selected.has(i)){selected.delete(i);}else{if(i===5||i===10){selected.clear();}else{selected.delete(5);selected.delete(10);}selected.add(i);}status.textContent='';update();};return b;}
    stage.querySelectorAll('[data-items]').forEach(grid=>grid.dataset.items.split(',').forEach(i=>grid.append(make(Number(i)))));stage.querySelector('[data-auto]').append(make(10));
    function setBusy(value){busy=value;update();output.querySelectorAll('button,input,textarea,select').forEach(n=>{n.disabled=value||(completed&&!!n.closest('.exercise-section, .exercise-submit'));});}
    // The current Apps Script returns {answer, sessionToken}; the original mockup
    // expected {data, sessionToken}. Accept both without changing the visual design.
    function decodePracticeResponse(res) {
      let data = res.data !== undefined ? res.data : res.answer;
      if (data == null) throw new Error('Dify chưa trả nội dung bài luyện tập.');
      for (let depth = 0; depth < 4; depth++) {
        if (typeof data === 'string') {
          let text = data.trim();
          if (!text) throw new Error('Dify trả câu trả lời trống.');
          text = text.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim();
          // Extract only a full JSON object/array. Never execute returned HTML.
          if (!text.startsWith('{') && !text.startsWith('[')) {
            const opening = text.indexOf('{'), closing = text.lastIndexOf('}');
            if (opening !== -1 && closing > opening) {
              const candidate = text.slice(opening, closing + 1);
              try {data = JSON.parse(candidate); continue;} catch (_) {}
            }
            return {view:'text',title:'Bài luyện tập',display_text:text};
          }
          try {data = JSON.parse(text); continue;}
          catch (_) {return {view:'text',title:'Bài luyện tập',display_text:text};}
        }
        if (Array.isArray(data)) {
          return {view:'text',title:'Bài luyện tập',display_text:JSON.stringify(data,null,2)};
        }
        if (!data || typeof data !== 'object') {
          return {view:'text',title:'Bài luyện tập',display_text:String(data)};
        }
        if (typeof data.answer === 'string' && !data.view && !data.sections) {
          data = data.answer;
          continue;
        }
        if (typeof data.output === 'string' && !data.view && !data.sections) {
          data = data.output;
          continue;
        }
        if (data.data && typeof data.data === 'object' && !data.view && !data.sections) {
          data = data.data;
          continue;
        }
        return data;
      }
      return {view:'text',title:'Bài luyện tập',display_text:typeof data==='string'?data:JSON.stringify(data,null,2)};
    }
    function callServer(method,payload,onSuccess){
      if(!window.google||!google.script||!google.script.run){status.textContent='Hãy mở trang qua Web App của Google Apps Script để gọi Dify.';return;}
      if(method==='replyPractice'&&String(payload.message||'').length>20000){status.textContent='Nội dung gửi vượt 20.000 ký tự. Hãy rút gọn hoặc gửi ít câu hơn.';return;}
      if(busy)return;
      setBusy(true);status.textContent=method==='generatePractice'?'Đang tạo bài luyện tập…':'Đang xử lý câu trả lời…';
      const runner=google.script.run.withSuccessHandler(res=>{
        try{
          if (!res || !res.sessionToken) throw new Error('Máy chủ chưa trả sessionToken.');
          sessionToken = res.sessionToken;
          if (method === 'generatePractice') {current=null;completed=false;sentAnswers.clear();}
          const data = decodePracticeResponse(res);
          render(data);
          if (onSuccess) onSuccess(data);
          status.textContent = '';
        }
        catch(e){status.textContent=e.message||'Không hiển thị được bài tập.';}
        finally{setBusy(false);}
      }).withFailureHandler(err=>{setBusy(false);status.textContent=err&&err.message?err.message:'Không gửi được yêu cầu. Vui lòng thử lại.';});
      if(method==='generatePractice')runner.generatePractice(payload);else runner.replyPractice(payload);
    }
    go.onclick=()=>{
      if(!selected.size){status.textContent='Bạn hãy chọn ít nhất một dạng bài.';return;}
      if(!words.value.trim()&&!topic.value.trim()){status.textContent='Hãy nhập từ hoặc chủ đề cần luyện.';words.focus();return;}
      callServer('generatePractice',{selectedTypes:[...selected].map(i=>i+1),words:words.value.trim(),topic:topic.value.trim()});
    };
    function prose(parent,text){
      if(!text)return;
      const box=el('div',undefined,'practice-prose');
      const lines=String(text).replace(/\\([*_`~])/g,'$1').split(/\r?\n/);
      const cells=line=>line.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(x=>x.trim());
      function inline(node,value){
        String(value).split(/(\*\*[^*]+\*\*)/g).forEach(part=>{
          node.append(part.startsWith('**')&&part.endsWith('**')?el('strong',part.slice(2,-2)):document.createTextNode(part));
        });
      }
      for(let i=0;i<lines.length;i++){
        if(lines[i].includes('|')&&i+1<lines.length&&/^\s*\|?\s*:?-{3,}/.test(lines[i+1])&&cells(lines[i+1]).every(c=>/^:?-{3,}:?$/.test(c))){
          const wrap=el('div',undefined,'results-table-wrap'),table=el('table'),head=el('thead'),tr=el('tr');
          cells(lines[i]).forEach(c=>{const th=el('th');th.scope='col';inline(th,c);tr.append(th);});head.append(tr);table.append(head);i++;
          const body=el('tbody');while(i+1<lines.length&&lines[i+1].includes('|')&&lines[i+1].trim()){
            const row=el('tr');cells(lines[++i]).forEach(c=>{const td=el('td');inline(td,c);row.append(td);});body.append(row);
          }table.append(body);wrap.append(table);box.append(wrap);
        }else{const line=el('div');inline(line,lines[i]);if(!lines[i])line.append(el('br'));box.append(line);}
      }parent.append(box);
    }
    function safeURL(value){try{const u=new URL(value);return u.protocol==='https:'?u.href:'';}catch(e){return '';}}
    function render(data){
      if(!data||typeof data!=='object'||Array.isArray(data))throw new Error('Dữ liệu bài tập phải là một đối tượng JSON.');
      // Feedback is appended without destroying the exercise or the learner's draft.
      if(data.view!=='exercise'&&current&&current.view==='exercise'){
        if(data.view==='results')completed=true;
        const panel=el('section',undefined,'practice-feedback');panel.setAttribute('aria-label','Phản hồi bài làm');
        panel.append(el('h4',data.title||'Phản hồi'));
        prose(panel,data.message);prose(panel,data.instructions);
        prose(panel,data.results_markdown||data.display_text);
        (Array.isArray(data.feedback)?data.feedback:[]).forEach(f=>{
          prose(panel,'Câu '+f.question_id+': '+f.result);
          if(f.your_answer)prose(panel,'Your answer: '+f.your_answer);
          if(f.correct_answer)prose(panel,'Correct answer: '+f.correct_answer);
          if(f.explanation)prose(panel,'Explanation: '+f.explanation);
        });
        prose(panel,data.submission_hint);
        const follow=output.querySelector('.practice-follow');output.insertBefore(panel,follow);
        if(follow)follow.querySelector('textarea').value='';
        panel.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'});
        return;
      }
      current=data;completed=data.view==='results';if(data.view==='exercise')sentAnswers.clear();answerControls=[];output.replaceChildren();output.hidden=false;
      output.append(el('h3',data.title||'Bài luyện tập'));prose(output,data.message);prose(output,data.instructions);
      const sections=Array.isArray(data.sections)?data.sections:[];
      if(data.view==='exercise'&&sections.length){
        sections.forEach(section=>{
          const box=el('section',undefined,'exercise-section');if(section.title)box.append(el('h4',section.title));prose(box,section.instructions);prose(box,section.passage);
          if(section.word_bank&&section.word_bank.length)prose(box,'Từ gợi ý: '+section.word_bank.join(' • '));
          (section.matching_options||[]).forEach(o=>prose(box,o.label+'. '+o.text));
          (section.questions||[]).forEach((q,index)=>{
            const group=el('fieldset',undefined,'exercise-question');group.append(el('legend',(q.number||index+1)+'. '+q.prompt));
            const imageURL=safeURL(q.image_url);if(imageURL){const img=el('img');img.src=imageURL;img.alt=q.image_alt||'';img.loading='lazy';img.onerror=()=>{img.replaceWith(el('p','Không tải được hình minh hoạ.'));};group.append(img);}
            let read;
            if(q.response_format==='single_choice'&&q.options&&q.options.length){
              const radioName='q-'+answerControls.length;const radios=[];
              q.options.forEach(o=>{const label=el('label',undefined,'answer-option');const input=el('input');input.type='radio';input.name=radioName;input.value=o.label;radios.push(input);label.append(input,document.createTextNode(o.label+'. '+o.text));group.append(label);});read=()=>{const checked=radios.find(r=>r.checked);return checked?checked.value:'';};
            }else{
              (q.options||[]).forEach(o=>prose(group,o.label+'. '+o.text));
              const input=el(q.response_format==='long_text'||q.response_format==='audio_or_text'?'textarea':'input');if(input.tagName==='INPUT')input.type='text';else input.rows=4;input.maxLength=8000;input.setAttribute('aria-label','Đáp án câu '+(q.number||index+1));group.append(input);read=()=>input.value.trim();
              if(q.response_format==='audio_or_text')prose(group,'Hiện hỗ trợ nhập bản trả lời bằng chữ; chưa có chức năng ghi âm.');
            }
            answerControls.push({id:q.id||String(q.number||index+1),read});box.append(group);
          });output.append(box);
        });
        (data.criteria||[]).forEach(c=>prose(output,c.label+' — tối đa '+c.max_score+' điểm'));
        prose(output,data.submission_hint);
        function sendAnswers(finalize){
          if(busy||completed)return;
          const exercise=current;
          const filled=answerControls.map(a=>({question_id:a.id,answer:a.read()})).filter(a=>a.answer);
          const answers=filled.filter(a=>sentAnswers.get(a.question_id)!==a.answer);
          if(!finalize&&!answers.length){
            status.textContent=filled.length?'Không có câu mới hoặc câu sửa để gửi.':'Bạn hãy trả lời ít nhất một câu trước khi gửi.';
            return;
          }
          const instruction=finalize
            ? 'Tôi nộp bài và yêu cầu kết thúc lượt luyện hiện tại. Dữ liệu dưới đây chỉ gồm câu mới hoặc đã sửa. Kết hợp với các câu đã được kiểm tra trong lịch sử để tổng kết cả bài. Không tính điểm trùng; giữ kết quả lần trả lời hợp lệ đầu tiên. Câu chưa làm ghi nhận là chưa trả lời.'
            : 'Kiểm tra các câu mới hoặc đã sửa dưới đây của bài hiện tại. Kết hợp với lịch sử bài làm. Chưa hoàn thành toàn bộ bài thì chưa tổng kết; đã hoàn thành toàn bộ bài thì tổng kết theo prompt. Không tiết lộ đáp án câu chưa làm. Với câu đã sửa, nhận xét việc sửa nhưng giữ kết quả lần trả lời hợp lệ đầu tiên để tính điểm.';
          const message=instruction+'\n'+JSON.stringify({exercise_id:exercise.exercise_id||'',answers});
          reply(message,response=>{
            if(current===exercise&&['feedback','results'].includes(response.view)){
              answers.forEach(a=>sentAnswers.set(a.question_id,a.answer));
            }
          });
        }
        const submit=el('button','Gửi câu mới / câu đã sửa','practice-action exercise-submit');submit.type='button';submit.onclick=()=>sendAnswers(false);output.append(submit);
        const finish=el('button','Nộp bài và tổng kết','practice-action exercise-submit');finish.type='button';finish.onclick=()=>sendAnswers(true);output.append(finish);
      }else{
        // Plain text rendering prevents execution of HTML returned by the model.
        prose(output,data.results_markdown||data.display_text);
        (Array.isArray(data.feedback)?data.feedback:[]).forEach(f=>{prose(output,'Câu '+f.question_id+': '+f.result);if(f.your_answer)prose(output,'Your answer: '+f.your_answer);if(f.correct_answer)prose(output,'Correct answer: '+f.correct_answer);if(f.explanation)prose(output,'Explanation: '+f.explanation);});
      }
      (data.media||[]).forEach(m=>{const url=safeURL(m.url);if(!url)return;if(m.type==='audio'){const audio=el('audio');audio.controls=true;audio.src=url;output.append(audio);}else if(m.type==='image'){const img=el('img');img.src=url;img.alt=m.alt||'';img.loading='lazy';output.append(img);}});
      const follow=el('form',undefined,'practice-follow');const message=el('textarea');message.rows=2;message.maxLength=18000;message.placeholder='Hỏi thêm, xin gợi ý hoặc yêu cầu làm tiếp…';message.setAttribute('aria-label','Tin nhắn tiếp theo');const send=el('button','Gửi','practice-action');send.type='submit';follow.append(message,send);follow.onsubmit=e=>{e.preventDefault();if(message.value.trim())reply(message.value.trim());};output.append(follow);
      output.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});
    }
    function reply(message,onSuccess){if(busy)return;if(!sessionToken){status.textContent='Hãy bắt đầu bài luyện tập trước.';return;}callServer('replyPractice',{sessionToken,message},onSuccess);}
    update();
  });
})();

#practice-designs, #practice-designs.practice-export { min-height:0!important; height:auto!important; overflow:visible!important; }

#practice-designs .app { min-height:0!important; height:auto!important; }

<script id="practice-iframe-autosize">
(function(){
  'use strict';
  let scheduled = false;
  function measure() {
    scheduled = false;
    const root = document.getElementById('practice-designs');
    if (!root || window.parent === window) return;
    // Geometry of rendered content, independent of the iframe's viewport height.
    const bottom = root.getBoundingClientRect().bottom + window.scrollY;
    const height = Math.ceil(Math.max(bottom, document.body.scrollHeight, 300));
    window.parent.postMessage({type:'ESP_PRACTICE_HEIGHT', height:height}, window.location.origin);
  }
  function schedule() {
    if(scheduled)return;
    scheduled=true;
    requestAnimationFrame(measure);
  }
  window.addEventListener('load', schedule);
  window.addEventListener('resize', schedule);
  window.addEventListener('message', event => {
    if(event.origin === window.location.origin && event.data?.type === 'ESP_PRACTICE_MEASURE') schedule();
  });
  if(typeof ResizeObserver !== 'undefined') {
    const root = document.getElementById('practice-designs');
    if(root) new ResizeObserver(schedule).observe(root);
  }
  const root = document.getElementById('practice-designs');
  if(root && typeof MutationObserver !== 'undefined') {
    new MutationObserver(schedule).observe(root,{childList:true,subtree:true,attributes:true,attributeFilter:['hidden','style','class']});
  }
  schedule();
})();
</script>
